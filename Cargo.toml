[package]
name = "wallet-cli"
version = "0.1.0"
edition = "2021"
authors = ["Orogen"]
license = "Apache-2.0"
description = "Command-line wallet for Orogen operators and validators."
repository = "https://github.com/orogen-network/wallet-cli"

[[bin]]
name = "wallet-cli"
path = "src/main.rs"

[dependencies]
wallet-sdk-core = { path = "../wallet-sdk-core", features = ["ws-rpc"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Async runtime (for future RPC submission)
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# Real RPC submission against a substrate chain-node.
subxt = { version = "0.41", default-features = false, features = ["native", "jsonrpsee"] }
subxt-signer = { version = "0.41", default-features = false, features = ["subxt", "sr25519", "std"] }

# SCALE codec for hand-rolled call encoding (no metadata-based macros — that
# would couple the CLI to a specific runtime build; here we encode `remark`
# and `transfer_keep_alive` manually so the binary works against any
# substrate chain that exposes pallet-indices for them.)
parity-scale-codec = { version = "3.7", features = ["derive"] }

# JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Config paths
directories = "5"

# Crypto-at-rest for keystore (Argon2 + ChaCha20-Poly1305)
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = "1"

# Interactive passphrase prompt (security audit M-W-02)
rpassword = "7"

# Hex / base64
hex = "0.4"
base64 = "0.22"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Errors
anyhow = "1"
thiserror = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
